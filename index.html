<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rex's Diner Ordering</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="logo" href="#" aria-label="Rex's Diner home">
      <span class="logo-rex">Rex's</span>
      <span class="logo-diner">Diner</span>
    </a>
  </header>

  <main class="page-shell">
    <div class="main-content">
      <section class="hero" aria-labelledby="hero-title">
        <div class="hero-copy">
          <p class="eyebrow">Welcome back!</p>
          <h1 id="hero-title">Good food. Good times.<br>Only at <span>Rex's.</span></h1>
          <div class="hero-actions" aria-label="Discount controls">
            <button class="outline-action" type="button" id="autoDiscountBtn">
              <span class="discount-icon" aria-hidden="true">%</span>
              Auto 10% Discount
            </button>
            <button class="outline-action" type="button" id="customDiscountBtn">
              <span class="discount-icon" aria-hidden="true">&#9998;</span>
              Custom Discount
            </button>
          </div>
        </div>
        <div class="hero-art fallback-frame" data-fallback="&#127828;" aria-hidden="true">
          <img src="images/hero-burger.png" alt="" data-fallback-image>
        </div>
      </section>

      <section class="menu-section" aria-labelledby="menu-title">
        <div class="section-heading">
          <p class="eyebrow">Diner menu</p>
          <h2 id="menu-title">Choose your cravings</h2>
        </div>
        <div class="menu-grid" id="menuGrid"></div>
      </section>
    </div>

    <aside class="order-panel" aria-labelledby="order-title">
      <div class="order-card">
        <div class="order-header">
          <h2 id="order-title"><span aria-hidden="true">&#128722;</span> Your Order</h2>
          <span class="order-count" id="orderCount">0 items</span>
        </div>

        <div class="cart-body" id="cartItems" aria-live="polite"></div>

        <div class="totals" aria-label="Order totals">
          <div class="total-row">
            <span>Subtotal</span>
            <strong id="subtotalAmount">$0</strong>
          </div>
          <div class="total-row discount-row">
            <span id="discountLabel">Discount (10%)</span>
            <strong id="discountAmount">-$0</strong>
          </div>
          <div class="total-row grand-total">
            <span>Total</span>
            <strong id="totalAmount">$0</strong>
          </div>
        </div>

        <div class="cart-actions">
          <button class="cart-action-btn cart-action-btn--primary" type="button" id="copyTotalBtn">
            <span class="cart-action-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M8 7h8" />
                <path d="M8 11h8" />
                <path d="M8 15h5" />
                <path d="M7 4h10a2 2 0 0 1 2 2v14H5V6a2 2 0 0 1 2-2Z" />
                <path d="M9 4.5a3 3 0 0 1 6 0" />
              </svg>
            </span>
            <span class="cart-action-btn__label">Copy Price</span>
          </button>
          <button class="cart-action-btn cart-action-btn--secondary" type="button" id="clearCartBtn">
            <span class="cart-action-btn__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" focusable="false">
                <path d="M5 7h14" />
                <path d="M9 7V5h6v2" />
                <path d="m8 10 .7 9h6.6l.7-9" />
                <path d="M10.5 12.5v4" />
                <path d="M13.5 12.5v4" />
              </svg>
            </span>
            <span class="cart-action-btn__label">Clear Cart</span>
          </button>
        </div>

        <div class="savings-box" id="savingsBox">
          <span class="savings-icon" aria-hidden="true">&#128184;</span>
          <div>
            <p id="savingsTitle">You're saving 10%!</p>
            <small>Confirm order details with customer.</small>
          </div>
        </div>
      </div>
    </aside>
  </main>

  <div class="discount-modal" id="discountModal" hidden>
    <div class="discount-modal__backdrop" data-discount-close></div>
    <form class="discount-dialog" id="discountForm" aria-labelledby="discountModalTitle">
      <div class="discount-dialog__header">
        <span class="discount-dialog__icon" aria-hidden="true">%</span>
        <div>
          <p class="eyebrow">Custom discount</p>
          <h2 id="discountModalTitle">Set order discount</h2>
        </div>
        <button class="discount-dialog__close" type="button" aria-label="Close custom discount" data-discount-close>&times;</button>
      </div>

      <label class="discount-field" for="discountInput">
        <span>Discount percentage</span>
        <span class="discount-input-wrap">
          <input id="discountInput" type="number" min="0" max="100" step="1" inputmode="numeric" placeholder="10">
          <span class="discount-stepper" aria-label="Adjust discount percentage">
            <button type="button" data-discount-step="1" aria-label="Increase discount">
              <svg viewBox="0 0 24 24" focusable="false"><path d="m7 14 5-5 5 5" /></svg>
            </button>
            <button type="button" data-discount-step="-1" aria-label="Decrease discount">
              <svg viewBox="0 0 24 24" focusable="false"><path d="m7 10 5 5 5-5" /></svg>
            </button>
          </span>
        </span>
      </label>

      <p class="discount-help" id="discountHelp">Enter a whole number from 0 to 100.</p>

      <div class="discount-dialog__actions">
        <button class="discount-cancel" type="button" data-discount-close>Cancel</button>
        <button class="discount-apply" type="submit">Apply Discount</button>
      </div>
    </form>
  </div>
</body>
</html>
